name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # L0 — static release gates (json integrity, package size, palette)
      - run: node script/check-gates.mjs
      # L1 + L2 — unit + miniprogram-simulate suites (packages/ui). NOTE:
      # path filter, not the name — the root package.json shares the
      # "looseleaf-miniprogram" name, so a name filter matches both.
      - run: pnpm -C packages/ui test
      # L3 remains local/nightly: DevTools automation needs a GUI (see
      # nightly-e2e.yml)
      - name: npm package publish-readiness check
        run: node script/check-npm-package.mjs
